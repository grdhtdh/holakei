```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pregunta Importante ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#5a0000;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    color:white;
}

.container{
    text-align:center;
    z-index:10;
}

h1{
    font-size:3rem;
    margin-bottom:25px;
    text-shadow:0 0 15px pink;
}

button{
    padding:15px 35px;
    font-size:22px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin:10px;
    transition:0.3s;
}

#si{
    background:#ff4d6d;
    color:white;
}

#no{
    background:#222;
    color:white;
}

.flotante{
    position:absolute;
    animation:subir linear infinite;
    user-select:none;
}

@keyframes subir{
    from{
        transform:translateY(100vh) rotate(0deg);
    }
    to{
        transform:translateY(-120vh) rotate(360deg);
    }
}

#mensajeNo{
    margin-top:20px;
    color:#ffd6d6;
    font-size:1.5rem;
}

.resultado{
    text-align:center;
}

.resultado h1{
    font-size:4rem;
}
</style>
</head>

<body>

<div id="particulas"></div>

<div class="container">
    <h1>¿Quieres ser mi novia? ❤️</h1>

    <button id="si">Sí 💖</button>
    <button id="no">No 😢</button>

    <div id="mensajeNo"></div>
</div>

<script>

const contenedor = document.getElementById("particulas");

for(let i=0;i<40;i++){

    let elemento=document.createElement("div");

    elemento.className="flotante";

    elemento.innerHTML=Math.random()>0.5?"❤️":"⭐";

    elemento.style.left=Math.random()*100+"vw";

    elemento.style.fontSize=(15+Math.random()*25)+"px";

    elemento.style.animationDuration=(8+Math.random()*10)+"s";

    elemento.style.opacity=Math.random();

    contenedor.appendChild(elemento);
}

let intentosNo=0;

const botonNo=document.getElementById("no");
const botonSi=document.getElementById("si");
const mensajeNo=document.getElementById("mensajeNo");

botonNo.addEventListener("click",()=>{

    intentosNo++;

    if(intentosNo>=3){
        mensajeNo.innerHTML="¿Como que no, sucie? 😭";
    }
});

botonSi.addEventListener("click",()=>{

    document.body.innerHTML=`
    <div class="resultado">
        <h1>💖 Te quiero mucho 💖</h1>
        <h2>Gracias por decir que sí ❤️</h2>
    </div>
    `;
});

</script>

</body>
</html>
