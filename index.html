<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pregunta Importante ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
}

h1{
    color:white;
    font-size:3rem;
    margin-bottom:30px;
}

button{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:10px;
}

#si{
    background:#4CAF50;
    color:white;
}

#no{
    background:#f44336;
    color:white;
    position:absolute;
}

#mensaje{
    color:white;
    font-size:2rem;
    margin-top:30px;
}
</style>
</head>

<body>

<div class="container">
    <h1>¿Quieres ser mi novia? ❤️</h1>

    <button id="si">Sí 💖</button>
    <button id="no">No 😢</button>

    <div id="mensaje"></div>
</div>

<script>
const botonNo = document.getElementById("no");
const botonSi = document.getElementById("si");
const mensaje = document.getElementById("mensaje");

botonNo.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);

    botonNo.style.left = x + "px";
    botonNo.style.top = y + "px";
});

botonSi.addEventListener("click", () => {
    document.body.innerHTML = `
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;color:white;font-family:Arial;">
            <h1>¡Sabía que dirías que sí! ❤️🥰</h1>
            <h2>Te quiero mucho 💕</h2>
        </div>
    `;
});
</script>

</body>
</html>
